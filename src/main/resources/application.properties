spring.application.name=osdrmsa-appl

#Server Port
server.port=8080

#Database Configuration
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/oracleDB}
spring.datasource.username=${DB_USERNAME:rcosd}
spring.datasource.password=${DB_PASSWORD:Changeme0}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

#JWT Configuration
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

#Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true